<!doctype html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"><title>Paper Arena Multiplayer</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1221;color:#f2f5ff;font:15px system-ui,Arial;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none}#hud{position:fixed;top:14px;left:14px;background:#0a1023dc;border:1px solid #34405b;border-radius:12px;padding:12px;max-width:245px}#hud strong{font-size:19px}#status{font-size:12px;color:#a5c8ff;margin-top:4px}#board{position:fixed;top:14px;right:14px;background:#0a1023dc;border:1px solid #34405b;border-radius:12px;padding:12px;min-width:160px}#board h3{margin:0 0 8px}#board div{font-size:13px;margin:4px 0}#menu{position:fixed;inset:0;display:grid;place-items:center;background:#080d19e8;z-index:5}#menu.hidden{display:none}.panel{width:min(90vw,400px);padding:30px;text-align:center;background:#192440;border:1px solid #405479;border-radius:20px;box-shadow:0 20px 80px #0008}.panel h1{font-size:36px;margin:0 0 8px}.panel p{color:#c2cee3;line-height:1.5}input,button{border:0;border-radius:10px;padding:12px;font:inherit}input{width:100%;background:#eaf0ff;color:#101525;margin:12px 0}button{background:#28c6f6;color:#001321;font-weight:800;cursor:pointer}#start{width:100%}#touch{position:fixed;bottom:22px;left:20px;display:none;grid-template-columns:repeat(3,52px);gap:5px}#touch button{height:52px;opacity:.85}#touch button:nth-child(1){grid-column:2}#touch button:nth-child(2){grid-column:1;grid-row:2}#touch button:nth-child(3){grid-column:2;grid-row:2}#touch button:nth-child(4){grid-column:3;grid-row:2}@media(pointer:coarse){#touch{display:grid}#board{min-width:125px;font-size:12px}#hud{max-width:160px}}
</style></head><body><canvas id="game"></canvas><div id="hud"><strong>🟦 PAPER ARENA</strong><div id="status">Conectare...</div><div style="font-size:12px;margin-top:6px">WASD / săgeți · Închide bucla pentru a cuceri</div></div><div id="board"><h3>🏆 Top jucători</h3><section id="scores">Așteptare...</section></div><div id="menu"><div class="panel"><h1>🎨 PAPER ARENA</h1><p>Cucerește teritorii și taie traseele adversarilor!</p><input id="nickname" maxlength="16" placeholder="Numele tău" value="Player"><button id="start" disabled>Conectare...</button><p id="message" style="font-size:12px">Se conectează la server</p></div></div><div id="touch"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),menu=document.getElementById('menu'),start=document.getElementById('start'),status=document.getElementById('status'),scores=document.getElementById('scores'),message=document.getElementById('message');
let ws,myId=null,state=null,size=70,started=false;
function connect(){const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}`);ws.onopen=()=>{status.textContent='🟢 Conectat';message.textContent='Server online';start.disabled=false;start.textContent='JOACĂ';};ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='welcome'){myId=m.id;size=m.size;}if(m.type==='state'){state=m;renderScores();}if(m.type==='dead'){status.textContent='💥 Eliminat — revii în 2 secunde';}if(m.type==='respawn'){status.textContent='🟢 Înapoi în joc';}if(m.type==='error')message.textContent=m.message;};ws.onclose=()=>{start.disabled=true;status.textContent='🔴 Deconectat';message.textContent='Reconectare...';setTimeout(connect,2500);};}
start.onclick=()=>{if(ws.readyState!==1)return;ws.send(JSON.stringify({type:'name',name:document.getElementById('nickname').value}));started=true;menu.classList.add('hidden');};
function direction(v){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'direction',value:v}));}
window.addEventListener('keydown',e=>{const map={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};if(map[e.code]){e.preventDefault();direction(map[e.code]);}});
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();direction(b.dataset.dir);}));
function renderScores(){const top=[...state.players].sort((a,b)=>b.score-a.score).slice(0,8);scores.replaceChildren(...top.map((p,i)=>{const d=document.createElement('div');d.textContent=`${i+1}. ${p.name}: ${p.score}`;d.style.color=p.color;return d;}));}
function draw(){const w=canvas.width=innerWidth*devicePixelRatio,h=canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#101a2d';ctx.fillRect(0,0,w,h);if(state&&started){const me=state.players.find(p=>p.id===myId);const cell=Math.max(10,Math.min(w,h)/26);const camX=(me?.x??size/2)*cell-w/2,camY=(me?.y??size/2)*cell-h/2;ctx.save();ctx.translate(-camX,-camY);ctx.fillStyle='#1b2940';ctx.fillRect(0,0,size*cell,size*cell);ctx.strokeStyle='#ffffff09';ctx.lineWidth=1;for(let i=0;i<=size;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,size*cell);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(size*cell,i*cell);ctx.stroke();}
const cmap=new Map(state.players.map(p=>[p.id,p.color]));for(let k=0;k<state.grid.length;k++){const owner=state.grid[k];if(owner===-1)continue;ctx.globalAlpha=.42;ctx.fillStyle=cmap.get(owner)||'#64748b';ctx.fillRect((k%size)*cell,Math.floor(k/size)*cell,cell+.5,cell+.5);}ctx.globalAlpha=1;
for(const p of state.players){ctx.fillStyle=p.color;for(const k of p.trail)ctx.fillRect((k%size)*cell+cell*.16,Math.floor(k/size)*cell+cell*.16,cell*.68,cell*.68);if(!p.alive)continue;ctx.fillStyle='#0b1220';ctx.fillRect(p.x*cell-cell*.43,p.y*cell-cell*.43,cell*.86,cell*.86);ctx.fillStyle=p.color;ctx.fillRect(p.x*cell-cell*.34,p.y*cell-cell*.34,cell*.68,cell*.68);ctx.fillStyle='#fff';ctx.font=`${Math.max(11,cell*.43)}px system-ui`;ctx.textAlign='center';ctx.fillText(p.name,p.x*cell,p.y*cell-cell*.65);}
ctx.restore();}requestAnimationFrame(draw);}connect();draw();
</script></body></html>
