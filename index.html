<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Paper Arena — Online Shooter</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e18;color:#edf4ff;font-family:Inter,system-ui,Segoe UI,Arial}canvas{display:block;width:100%;height:100%;touch-action:none}#top{position:fixed;left:14px;top:14px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}.card{background:#0b1424e8;border:1px solid #2a3b54;border-radius:13px;padding:11px 14px;box-shadow:0 8px 28px #0005}.brand{font-weight:900;letter-spacing:.5px;font-size:17px}.muted{color:#9fb2ce;font-size:12px;margin-top:4px}#stats{position:fixed;right:14px;top:14px;min-width:165px;max-width:220px}#stats h3{margin:0 0 8px;font-size:14px}#leaderboard div{font-size:12px;display:flex;justify-content:space-between;gap:14px;padding:3px 0}#healthWrap{margin-top:8px;height:7px;border-radius:9px;background:#27344a;overflow:hidden}#health{height:100%;width:100%;background:#50e39a;transition:width .12s}#menu{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(ellipse at center,#142743dd,#050914f2)}#menu.hidden{display:none}.panel{width:min(92vw,430px);padding:28px;background:#101b2eeF;border:1px solid #354b69;border-radius:22px;box-shadow:0 24px 90px #0009;text-align:center}.logo{font-size:34px;font-weight:950;letter-spacing:-1px}.logo span{color:#40d9ff}.panel p{color:#aabbd3;line-height:1.55;font-size:14px}input,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #354b69}input{width:100%;background:#091321;color:#fff;margin:10px 0 12px}button{cursor:pointer;background:#40d9ff;color:#07121e;border:0;font-weight:850}button:disabled{opacity:.5}#play{width:100%;padding:13px}#message{font-size:12px;min-height:16px}#mobile{display:none;position:fixed;bottom:20px;left:16px;right:16px;justify-content:space-between;align-items:end;pointer-events:none}#stick{width:126px;height:126px;border-radius:50%;background:#a8c9ef18;border:1px solid #a8c9ef55;pointer-events:auto;touch-action:none;position:relative}#nub{position:absolute;width:48px;height:48px;border-radius:50%;background:#69cfffaa;border:1px solid #b7edff;left:38px;top:38px}#fire{pointer-events:auto;width:84px;height:84px;border-radius:50%;background:#ff6c65dd;color:white;border:2px solid #ffc0bd;touch-action:none}@media(pointer:coarse){#mobile{display:flex}#stats{top:112px;right:10px;min-width:132px;padding:9px}#top{left:10px;top:10px}.brand{font-size:14px}#top .card{padding:9px 10px}.muted{font-size:10px}}
</style></head><body>
<canvas id="game"></canvas>
<div id="top"><div class="card"><div class="brand">⚡ PAPER <span style="color:#40d9ff">ARENA</span></div><div class="muted" id="status">Se conectează la server…</div><div id="healthWrap"><div id="health"></div></div><div class="muted" id="hpText">HP: 100 / 100</div></div><div class="card muted">WASD pentru mișcare<br>Mouse pentru țintire · Click pentru foc</div></div>
<div id="stats" class="card"><h3>🏆 Clasament</h3><div id="leaderboard">Așteptare jucători…</div></div>
<div id="menu"><div class="panel"><div class="logo">PAPER <span>ARENA</span></div><p>Multiplayer top-down shooter. Mișcă-te, folosește obstacolele ca acoperire și elimină adversarii.</p><input id="nickname" maxlength="16" value="Player" placeholder="Numele tău"><button id="play" disabled>SE CONECTEAZĂ…</button><p id="message">Așteaptă conectarea la server.</p></div></div>
<div id="mobile"><div id="stick"><div id="nub"></div></div><button id="fire">FIRE</button></div>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');const statusEl=document.querySelector('#status'),healthEl=document.querySelector('#health'),hpText=document.querySelector('#hpText'),leaderboard=document.querySelector('#leaderboard'),menu=document.querySelector('#menu'),play=document.querySelector('#play'),message=document.querySelector('#message');
let ws,myId=null,world={w:2200,h:1500},obstacles=[],statePlayers=[],stateBullets=[],started=false,dead=false,lastFrame=performance.now(),mouse={x:innerWidth/2,y:innerHeight/2},keys={},camera={x:0,y:0},mobile={x:0,y:0,fire:false},lastInput=0;
const remote=new Map();
function connect(){const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}`);ws.onopen=()=>{statusEl.textContent='● Conectat';play.disabled=false;play.textContent='INTRĂ ÎN ARENĂ';message.textContent='Server online';};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='welcome'){myId=m.id;world=m.world;obstacles=m.obstacles||[];}if(m.type==='state'){statePlayers=m.players||[];stateBullets=m.bullets||[];const present=new Set(statePlayers.map(p=>p.id));for(const id of remote.keys())if(!present.has(id))remote.delete(id);for(const p of statePlayers){let r=remote.get(p.id);if(!r)remote.set(p.id,{x:p.x,y:p.y});r=remote.get(p.id);r.tx=p.x;r.ty=p.y;r.data=p;}updateHud();}if(m.type==='error'){message.textContent=m.message;play.disabled=true;}};ws.onclose=()=>{statusEl.textContent='● Deconectat — reconectare…';play.disabled=true;play.textContent='SE CONECTEAZĂ…';setTimeout(connect,2000)};ws.onerror=()=>{};}
play.onclick=()=>{if(!ws||ws.readyState!==1)return;ws.send(JSON.stringify({type:'name',name:document.querySelector('#nickname').value.trim().slice(0,16)||'Player'}));started=true;menu.classList.add('hidden');};
window.addEventListener('keydown',e=>{const map={KeyW:'up',ArrowUp:'up',KeyS:'down',ArrowDown:'down',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right',Space:'fire'};if(map[e.code]){keys[map[e.code]]=true;e.preventDefault();}});window.addEventListener('keyup',e=>{const map={KeyW:'up',ArrowUp:'up',KeyS:'down',ArrowDown:'down',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right',Space:'fire'};if(map[e.code])keys[map[e.code]]=false;});window.addEventListener('blur',()=>{keys={};mobile.x=mobile.y=0;mobile.fire=false});canvas.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button===0)keys.fire=true});window.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')keys.fire=false});
const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');let stickPointer=null;function moveStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=43;if(len>max){dx=dx/len*max;dy=dy/len*max}mobile.x=dx/max;mobile.y=dy/max;nub.style.transform=`translate(${dx}px,${dy}px)`;}stick.addEventListener('pointerdown',e=>{stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer)moveStick(e)});function releaseStick(){stickPointer=null;mobile.x=mobile.y=0;nub.style.transform='translate(0,0)'}stick.addEventListener('pointerup',releaseStick);stick.addEventListener('pointercancel',releaseStick);const fireBtn=document.querySelector('#fire');fireBtn.addEventListener('pointerdown',e=>{e.preventDefault();mobile.fire=true;fireBtn.setPointerCapture(e.pointerId)});fireBtn.addEventListener('pointerup',()=>mobile.fire=false);fireBtn.addEventListener('pointercancel',()=>mobile.fire=false);
function updateHud(){const me=statePlayers.find(p=>p.id===myId);if(me){healthEl.style.width=Math.max(0,me.hp)+'%';hpText.textContent=me.alive?`HP: ${Math.max(0,me.hp)} / 100`:'Respawn în curând…';if(!me.alive&&!dead){dead=true;statusEl.textContent='Eliminat — revii imediat';}if(me.alive&&dead){dead=false;statusEl.textContent='● Conectat';}}const sorted=[...statePlayers].sort((a,b)=>b.kills-a.kills||a.deaths-b.deaths).slice(0,8);leaderboard.replaceChildren(...sorted.map((p,i)=>{const row=document.createElement('div'),name=document.createElement('span'),score=document.createElement('b');name.textContent=`${i+1}. ${p.name}`;name.style.color=p.color;score.textContent=`${p.kills} K`;row.append(name,score);return row;}));}
function sendInput(now){if(!started||!ws||ws.readyState!==1||now-lastInput<33)return;lastInput=now;const me=remote.get(myId)?.data;if(!me)return;const screenX=me.x-camera.x,screenY=me.y-camera.y;const a=Math.atan2(mouse.y-screenY,mouse.x-screenX);ws.send(JSON.stringify({type:'input',keys:{up:!!keys.up||mobile.y<-.25,down:!!keys.down||mobile.y>.25,left:!!keys.left||mobile.x<-.25,right:!!keys.right||mobile.x>.25,fire:!!keys.fire||mobile.fire},aim:a}));}
function roundRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function draw(now){const dpr=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;if(canvas.width!==Math.floor(w*dpr)||canvas.height!==Math.floor(h*dpr)){canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#080e18';ctx.fillRect(0,0,w,h);sendInput(now);
 const me=remote.get(myId);if(me){const tx=Math.max(0,Math.min(world.w-w,me.x-w/2)),ty=Math.max(0,Math.min(world.h-h,me.y-h/2));camera.x+=(tx-camera.x)*Math.min(1,d/70);camera.y+=(ty-camera.y)*Math.min(1,d/70)}
 ctx.save();ctx.translate(-camera.x,-camera.y);ctx.fillStyle='#101c2c';ctx.fillRect(0,0,world.w,world.h);ctx.strokeStyle='#ffffff08';ctx.lineWidth=1;const step=50;for(let x=Math.floor(camera.x/step)*step;x<camera.x+w+step;x+=step){ctx.beginPath();ctx.moveTo(x, camera.y);ctx.lineTo(x,camera.y+h);ctx.stroke()}for(let y=Math.floor(camera.y/step)*step;y<camera.y+h+step;y+=step){ctx.beginPath();ctx.moveTo(camera.x,y);ctx.lineTo(camera.x+w,y);ctx.stroke()}
 // world border
 ctx.strokeStyle='#42d9ff66';ctx.lineWidth=5;ctx.strokeRect(0,0,world.w,world.h);
 for(const o of obstacles){if(o.x+o.w<camera.x-50||o.x>camera.x+w+50||o.y+o.h<camera.y-50||o.y>camera.y+h+50)continue;let fill=o.type==='wall'?'#53677e':o.type==='barrel'?'#985d45':'#35465b';roundRect(o.x,o.y,o.w,o.h,o.type==='barrel'?Math.min(o.w,o.h)/2:8,fill,'#8196b155');ctx.fillStyle='#ffffff12';ctx.fillRect(o.x+5,o.y+5,Math.max(0,o.w-10),5);if(o.type==='barrel'){ctx.strokeStyle='#e6a07a66';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(o.x+12,o.y+o.h*.32);ctx.lineTo(o.x+o.w-12,o.y+o.h*.32);ctx.moveTo(o.x+12,o.y+o.h*.68);ctx.lineTo(o.x+o.w-12,o.y+o.h*.68);ctx.stroke()}}
 for(const b of stateBullets){ctx.beginPath();ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=12;ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
 for(const [id,r] of remote){const p=r.data;if(!p||!p.alive)continue;r.x+=(r.tx-r.x)*Math.min(1,d/65);r.y+=(r.ty-r.y)*Math.min(1,d/65);ctx.save();ctx.translate(r.x,r.y);if(p.invulnerable){ctx.strokeStyle='#ffffffaa';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,24,0,Math.PI*2);ctx.stroke()}ctx.rotate(p.aim||0);ctx.fillStyle='#080d16';roundRect(0,-6,31,12,4,'#17263b','#8fa5c7');ctx.fillStyle='#b7c8df';ctx.fillRect(12,-3,19,6);ctx.restore();ctx.beginPath();ctx.fillStyle='#0008';ctx.arc(r.x+2,r.y+4,19,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.fillStyle=p.color;ctx.arc(r.x,r.y,17,0,Math.PI*2);ctx.fill();ctx.strokeStyle=id===myId?'#ffffff':'#ffffff55';ctx.lineWidth=id===myId?3:1.5;ctx.stroke();ctx.fillStyle='#09111d';ctx.fillRect(r.x-18,r.y-29,36,4);ctx.fillStyle=p.hp>50?'#51e69a':p.hp>25?'#ffcb55':'#ff5964';ctx.fillRect(r.x-18,r.y-29,36*Math.max(0,p.hp)/100,4);ctx.fillStyle='#eef5ff';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText(p.name,r.x,r.y-35)}
 ctx.restore();requestAnimationFrame(t=>{d=Math.min(50,t-lastFrame);lastFrame=t;draw(t)});}
let d=16;connect();requestAnimationFrame(t=>{lastFrame=t;draw(t)});
</script></body></html>
